[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aslscp"
version = "0.2.4"
description = "ASL self-contained processing pipeline for Flywheel"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

dependencies = [
    "numpy<2.0.0",
    "scipy",
    "nibabel",
    "matplotlib",
    "transforms3d",
    "fw-gear[sdk]~=0.3.0",
    "aspose-words",
    "reportlab",
    "nilearn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["workflows*"]
