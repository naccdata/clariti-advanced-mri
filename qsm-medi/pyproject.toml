[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qsm-medi"
version = "2.5.0"
description = "Flywheel gear for QSM processing using MEDI+mSMV pipeline."
requires-python = ">=3.9"
dependencies = [
    "nibabel>=5.1.0,<6",
    "fw-gear[sdk]~=0.3.0",
    "hd-bet @ file:///opt/HD-BET",
    # Pinned to the version validated in the container build. HD-BET declares an
    # unbounded `torch>=0.4.1`; declaring torch directly (a) pins it for
    # reproducibility and (b) forces the CPU wheel via the source below. The
    # pipeline runs hd-bet with `-device cpu`, so the CUDA build's bundled
    # nvidia/cuDNN libraries (several GB) are never used.
    "torch==2.8.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/flywheel"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py39"
extend-exclude = ["src/hd-bet", "src/mSMV-vkernel_250813"]

[tool.ruff.lint]
select = ["A", "B", "BLE", "D", "E", "W", "F", "I", "RUF", "SIM", "C90", "PLW0406", "COM818", "SLF001"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--cov=src/flywheel",
    "--cov-report=html",
    "--cov-report=term-missing",
]
