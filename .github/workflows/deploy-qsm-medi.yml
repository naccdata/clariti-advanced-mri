name: Deploy QSM-MEDI gear

# Builds the qsm-medi gear image and promotes it through Flywheel instances.
#
# Deploys are a fork-only concern: upstream (rt-ward/Advanced-MRI) owns the gear
# and pipeline code, but releases are managed here. Guards that keep this from
# running outside the fork:
#   1. The owner gate on each job (explicit, readable).
#   2. Per-gear-environment-scoped FLYWHEEL API keys that only exist in this fork.
#   3. The AWS OIDC role trust policy, scoped to this gear's GitHub environments
#      (enforced AWS-side) — so only this gear's jobs can assume its roles.
#
# Triggers are deliberate, never automatic: a `qsm-medi-v*` tag drives a
# release, and workflow_dispatch allows manual redeploys. Merges from upstream
# that touch qsm-medi/** do NOT trigger a deploy (that is the test workflow's
# job) — only an explicit tag or dispatch does.
#
# Promotion model (build once in ECR, publish the same artifact to each instance):
#   - deploy-sandbox builds the image once and pushes it to ECR
#     (clariti/qsm-medi) — the build/promotion artifact store. It then pulls that
#     image back, tags it to custom.gear-builder.image, and publishes it to the
#     sandbox instance with `flyw gear upload`. The pushed digest is recorded.
#   - deploy-production waits for a required reviewer, then re-pulls the same ECR
#     image and publishes it to the production instance the same way. No rebuild.
# `gear upload` (not `gear install`) is the publish verb: it tags the local image
# and pushes it into the target instance's own registry, then registers the gear.
# ECR is the promotion vehicle; each instance ends up hosting its own copy.
on:
  push:
    tags:
      - 'qsm-medi-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Gear version to deploy (must match manifest/pyproject, e.g. 2.5.0)'
        required: true
        type: string

permissions:
  id-token: write   # required for AWS OIDC federation
  contents: read

env:
  # Shared-services account 380366436539, us-west-2. ECR repo and OIDC roles
  # provisioned via Terraform (see scratch/gear-deploy-aws-requirements.md).
  AWS_REGION: us-west-2
  ECR_REGISTRY: 380366436539.dkr.ecr.us-west-2.amazonaws.com
  ECR_REPOSITORY: clariti/qsm-medi
  # Two roles, split by capability (least privilege):
  #   push role  -> sandbox job builds and pushes to ECR
  #   pull role  -> production installs from ECR (read-only)
  AWS_PUSH_ROLE_ARN: arn:aws:iam::380366436539:role/clariti-qsm-medi-push
  AWS_PULL_ROLE_ARN: arn:aws:iam::380366436539:role/clariti-qsm-medi-pull

jobs:
  # ---------------------------------------------------------------------------
  # Sandbox: automatic on tag. Builds, pushes to ECR, uploads to sandbox FW.
  # ---------------------------------------------------------------------------
  deploy-sandbox:
    if: github.repository == 'naccdata/clariti-advanced-mri'
    runs-on: ubuntu-latest  # native x86_64: MCR is x86_64-only, no emulation
    environment: qsm-medi-sandbox  # per-gear env; no protection rule -> runs through
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # Resolve the version from either the tag (`qsm-medi-v<version>`) or the
      # dispatch input.
      - name: Resolve target version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#qsm-medi-v}"
          else
            version="${{ github.event.inputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Deploying qsm-medi version: $version"

      # Guard: the target version must match manifest.json, pyproject.toml, and
      # run.sh (PIPELINE_VERSION). Enforces the review standard that these stay
      # in lockstep, and prevents deploying a tag that disagrees with the source.
      - name: Verify version consistency
        working-directory: qsm-medi
        run: |
          target="${{ steps.version.outputs.version }}"
          manifest=$(jq -r '.version' manifest.json)
          pyproject=$(grep -oP '^version = "\K[^"]+' pyproject.toml)
          runsh=$(grep -oP 'PIPELINE_VERSION="\K[^"]+' src/scripts/run.sh)
          # The manifest also embeds the version in the image tag and the ECR
          # rootfs-url; a stale tag there would point install at the wrong image.
          builder_img=$(jq -r '.custom["gear-builder"].image' manifest.json)   # clariti/qsm-medi:<v>
          rootfs_url=$(jq -r '.exchange["rootfs-url"]' manifest.json)          # <ecr>/clariti/qsm-medi:<v>
          builder_tag="${builder_img##*:}"
          rootfs_tag="${rootfs_url##*:}"

          echo "target (tag/input):        $target"
          echo "manifest.json version:     $manifest"
          echo "pyproject.toml:            $pyproject"
          echo "run.sh:                    $runsh"
          echo "gear-builder.image tag:    $builder_tag"
          echo "exchange.rootfs-url tag:   $rootfs_tag"

          fail=0
          [ "$target" = "$manifest" ] || { echo "::error::manifest.json version ($manifest) != target ($target)"; fail=1; }
          [ "$target" = "$pyproject" ] || { echo "::error::pyproject.toml ($pyproject) != target ($target)"; fail=1; }
          [ "$target" = "$runsh" ] || { echo "::error::run.sh ($runsh) != target ($target)"; fail=1; }
          [ "$target" = "$builder_tag" ] || { echo "::error::gear-builder.image tag ($builder_tag) != target ($target)"; fail=1; }
          [ "$target" = "$rootfs_tag" ] || { echo "::error::exchange.rootfs-url tag ($rootfs_tag) != target ($target)"; fail=1; }
          [ "$fail" = "0" ] || exit 1

      # Sanity check: the fork owns a couple of manifest fields that upstream
      # does not carry the same way (upstream ships a non-ECR builder image and
      # no private flag). An upstream pull can silently revert these, so validate
      # them here BEFORE any build — catching the drift the CONTRIBUTING reconcile
      # step guards against.
      #
      # Note: we do NOT check exchange.rootfs-url. `flyw gear upload` overwrites
      # exchange (to docker://<site>/qsm-medi:<v>) at publish time, so any value
      # in the manifest is ignored — asserting it here would be theater.
      - name: Sanity-check fork deploy fields in manifest
        working-directory: qsm-medi
        env:
          EXPECTED_ECR_REPO: clariti/qsm-medi
        run: |
          target="${{ steps.version.outputs.version }}"
          builder_img=$(jq -r '.custom["gear-builder"].image' manifest.json)
          private=$(jq -r '.custom.flywheel.private' manifest.json)

          echo "gear-builder.image:      $builder_img"
          echo "custom.flywheel.private: $private"

          fail=0
          # Version must be a clean release semver (MAJOR.MINOR.PATCH, digits
          # only) — the fork deploys release tags, not pre-releases or build
          # metadata. This rejects e.g. 2.5.1-beta, 2.5.1-rc1, 2.5.1+build,
          # v2.5.1, or 2.5 that an upstream pull or a bad tag could introduce.
          if ! printf '%s' "$target" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::deploy version ($target) is not a clean release semver (expected MAJOR.MINOR.PATCH); the fork deploys release tags only"
            fail=1
          fi
          # Builder image must be clariti/qsm-medi:<version> — this is the local
          # tag `gear upload` resolves and pushes (we pull the ECR image and tag
          # it to exactly this). Upstream uses aevia.azurecr.io, so a stale value
          # here means an upstream pull was not reconciled.
          [ "$builder_img" = "${EXPECTED_ECR_REPO}:${target}" ] \
            || { echo "::error::gear-builder.image ($builder_img) != ${EXPECTED_ECR_REPO}:${target} (did an upstream pull revert it?)"; fail=1; }
          # Private gear flag — fork-owned policy; upstream does not set it.
          [ "$private" = "true" ] \
            || { echo "::error::custom.flywheel.private ($private) must be true for the fork's deploy"; fail=1; }
          [ "$fail" = "0" ] || exit 1
          echo "Manifest fork deploy fields OK."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The MathWorks base layer is large; ubuntu-latest may need headroom.
      # Measure on the first real run and drop this if it proves unnecessary.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h /

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Build once, push to ECR (the build/promotion artifact store). Digest
      # recorded for traceability. Both instances re-pull this same image from
      # ECR and publish it with `flyw gear upload`; neither rebuilds.
      #
      # ECR tags are immutable, and a re-deploy of an already-built version is a
      # legitimate case (e.g. retrying the publish step after a fix). So if the
      # version tag already exists in ECR, reuse it: skip the build/push and
      # record the existing digest. Only build when the tag is absent.
      - name: Build and push image (linux/amd64)
        id: build
        working-directory: qsm-medi
        run: |
          version="${{ steps.version.outputs.version }}"
          image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${version}"

          existing_digest=$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}" \
            --image-ids imageTag="${version}" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)

          if [ -n "$existing_digest" ] && [ "$existing_digest" != "None" ]; then
            echo "Image ${ECR_REPOSITORY}:${version} already exists (immutable tag); reusing it."
            echo "Existing digest: ${existing_digest}"
            echo "digest=${existing_digest}" >> "$GITHUB_OUTPUT"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No existing ${ECR_REPOSITORY}:${version} in ECR; building and pushing."
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --metadata-file /tmp/build-meta.json \
            -t "$image" \
            .
          digest=$(jq -r '."containerimage.digest"' /tmp/build-meta.json)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "built=true" >> "$GITHUB_OUTPUT"
          echo "Pushed ${ECR_REPOSITORY}@${digest}"

      # Publish to the sandbox instance with `flyw gear upload`. The CLI tags a
      # LOCAL image (custom.gear-builder.image) and pushes it into the Flywheel
      # instance's own registry, then registers via prepare-add + save. So we
      # first pull the just-built image from ECR and tag it to match
      # custom.gear-builder.image, then run upload. (`gear install` was wrong: it
      # looks up gears in Flywheel's public exchange, not our instance or ECR.)
      # ECR remains the build/promotion artifact store; production re-pulls the
      # same ECR image and publishes it identically.
      - name: Install Flywheel CLI
        run: |
          export FW_CLI_INSTALL_DIR="$HOME/.local/bin"
          mkdir -p "$FW_CLI_INSTALL_DIR"
          curl https://storage.googleapis.com/flywheel-dist/fw-cli/stable/install.sh | bash
          echo "$FW_CLI_INSTALL_DIR" >> "$GITHUB_PATH"

      # Gearbot API key from SSM (sandbox instance). The key value embeds the
      # site (e.g. naccdata.flywheel.io:<key>), so login targets sandbox by
      # virtue of which parameter we read. SecureString encrypted under
      # alias/nacc-ci-secrets; the push role grants ssm:GetParameter + kms:Decrypt.
      - name: Fetch gearbot key (sandbox) from SSM
        id: fwkey
        run: |
          key=$(aws ssm get-parameter --name "${SSM_SANDBOX_KEY_PARAM}" --with-decryption --query 'Parameter.Value' --output text)
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
        env:
          SSM_SANDBOX_KEY_PARAM: /sandbox/flywheel/nacc-admin/apikey

      - name: Log in to sandbox Flywheel
        run: FW_CLI_API_KEY="${{ steps.fwkey.outputs.key }}" flyw auth login

      # Pull the built image from ECR and tag it to match custom.gear-builder.image
      # so `flyw gear upload` finds it locally. The build step pushed with buildx
      # --push (no local load), so an explicit pull is required even in sandbox;
      # this also keeps sandbox and production symmetric.
      - name: Fetch image from ECR for upload
        run: |
          ecr_image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ steps.version.outputs.version }}"
          local_image="clariti/qsm-medi:${{ steps.version.outputs.version }}"  # == custom.gear-builder.image
          docker pull "$ecr_image"
          docker tag "$ecr_image" "$local_image"

      # Publish to the sandbox instance. gear upload reads qsm-medi/manifest.json,
      # tags custom.gear-builder.image as <site>/qsm-medi:<v>, pushes it into the
      # sandbox instance registry, and registers the gear.
      - name: Upload gear to sandbox
        working-directory: qsm-medi
        run: FW_CLI_API_KEY="${{ steps.fwkey.outputs.key }}" flyw gear upload .

  # ---------------------------------------------------------------------------
  # Production: gated behind a required reviewer on the production environment.
  # Re-pulls the same ECR image built in sandbox and publishes it to the
  # production instance with `flyw gear upload`. Never rebuilds.
  # ---------------------------------------------------------------------------
  deploy-production:
    needs: deploy-sandbox
    if: github.repository == 'naccdata/clariti-advanced-mri'
    runs-on: ubuntu-latest
    environment: qsm-medi-production  # per-gear env; required-reviewer rule pauses for approval
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Pull-only role: production never writes to ECR.
          role-to-assume: ${{ env.AWS_PULL_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Flywheel CLI
        run: |
          export FW_CLI_INSTALL_DIR="$HOME/.local/bin"
          mkdir -p "$FW_CLI_INSTALL_DIR"
          curl https://storage.googleapis.com/flywheel-dist/fw-cli/stable/install.sh | bash
          echo "$FW_CLI_INSTALL_DIR" >> "$GITHUB_PATH"

      # Gearbot API key from SSM (production instance). SecureString encrypted
      # under alias/nacc-ci-secrets; the pull role grants ssm:GetParameter +
      # kms:Decrypt.
      - name: Fetch gearbot key (production) from SSM
        id: fwkey
        run: |
          key=$(aws ssm get-parameter --name "${SSM_PROD_KEY_PARAM}" --with-decryption --query 'Parameter.Value' --output text)
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
        env:
          SSM_PROD_KEY_PARAM: /prod/flywheel/nacc-admin/apikey

      - name: Log in to production Flywheel
        run: FW_CLI_API_KEY="${{ steps.fwkey.outputs.key }}" flyw auth login

      # Pull the same image sandbox built (by the deploy-sandbox version output)
      # and tag it to match custom.gear-builder.image. Pull-only ECR role — no
      # rebuild, no ECR write; the push goes into the production instance registry.
      - name: Fetch image from ECR for upload
        run: |
          version="${{ needs.deploy-sandbox.outputs.version }}"
          ecr_image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${version}"
          local_image="clariti/qsm-medi:${version}"  # == custom.gear-builder.image
          docker pull "$ecr_image"
          docker tag "$ecr_image" "$local_image"

      # Publish the same artifact to the production instance.
      - name: Upload gear to production
        working-directory: qsm-medi
        run: FW_CLI_API_KEY="${{ steps.fwkey.outputs.key }}" flyw gear upload .
