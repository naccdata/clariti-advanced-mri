name: Check QSMxT base image updates

on:
  schedule:
    - cron: '0 9 * * 1' # Weekly on Monday at 9:00 UTC
  workflow_dispatch:

jobs:
  check-base-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get current version from Dockerfile
        id: current
        run: |
          version=$(grep -oP 'vnmd/qsmxt_\K[^@]+' QSMxT/Dockerfile)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check Docker Hub for newer images
        id: check
        run: |
          # List all qsmxt_ repos from the vnmd namespace
          tags=$(curl -s "https://hub.docker.com/v2/repositories/vnmd/?page_size=100" \
            | jq -r '.results[].name' \
            | grep '^qsmxt_' \
            | sed 's/qsmxt_//' \
            | sort -V)
          latest=$(echo "$tags" | tail -1)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Create issue if update available
        if: steps.check.outputs.latest != steps.current.outputs.version
        uses: actions/github-script@v7
        with:
          script: |
            const current = '${{ steps.current.outputs.version }}';
            const latest = '${{ steps.check.outputs.latest }}';

            // Check for an existing open issue to avoid duplicates
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies',
            });
            const title = `QSMxT base image update available: ${current} → ${latest}`;
            const existing = issues.find(i => i.title === title);
            if (existing) {
              console.log(`Issue already exists: #${existing.number}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `A newer QSMxT base image is available on Docker Hub.\n\n` +
                    `- Current: \`vnmd/qsmxt_${current}\`\n` +
                    `- Available: \`vnmd/qsmxt_${latest}\`\n\n` +
                    `See the [update procedure](QSMxT/README.md#maintaining-the-base-image).`,
              labels: ['dependencies'],
            });
