name: Check QSMxT base image updates

on:
  schedule:
    - cron: '0 9 * * 1' # Weekly on Monday at 9:00 UTC
  workflow_dispatch:

jobs:
  check-base-image:
    # Fork-only: the file is shared gear CI and therefore lives upstream too,
    # but this watchdog files issues for naccdata maintainers (who do the
    # redeploys) and needs issue-write permission the fork grants and upstream
    # does not. The owner gate makes it no-op in upstream instead of failing
    # there every week. Same pattern as deploy-qsm-medi.yml.
    if: github.repository == 'naccdata/clariti-advanced-mri'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Get current version from Dockerfile
        id: current
        run: |
          version=$(grep -oP 'vnmd/qsmxt_\K[^@]+' QSMxT/Dockerfile)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check Docker Hub for newer images
        id: check
        run: |
          # QSMxT images are published by NeuroDesk as one repo PER VERSION in
          # the vnmd namespace, named `qsmxt_<version>` (e.g. qsmxt_8.3.2) — the
          # version is in the repo name, not a tag. So we enumerate repos, not
          # tags, and pick the highest version.
          #
          # Two things the old query got wrong:
          #   1. It listed the whole vnmd namespace unfiltered at page_size=100.
          #      vnmd has far more than 100 repos, so qsmxt_8.3.2 (and every
          #      version above ~1.1.7) fell off page 1 and was never seen — the
          #      "latest" came out as 1.1.7, lower than what we're pinned to.
          #      The `&name=qsmxt` server-side filter returns the full qsmxt set
          #      on a single page, so no pagination is needed.
          #   2. The namespace also contains `qsmxtbase_*` repos and non-release
          #      refs (`qsmxt_master`, `qsmxt_v2.0.0`, `qsmxt_4.0.0.post2`) that
          #      must not be mistaken for the latest release. We keep only names
          #      matching exactly `qsmxt_<MAJOR.MINOR.PATCH>` (digits only).
          repos=$(curl -sf "https://hub.docker.com/v2/repositories/vnmd/?page_size=100&name=qsmxt" \
            | jq -r '.results[].name')
          versions=$(echo "$repos" \
            | grep -E '^qsmxt_[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^qsmxt_//' \
            | sort -V)
          if [ -z "$versions" ]; then
            echo "::error::No qsmxt_<semver> repositories found on Docker Hub (API shape changed?)."
            exit 1
          fi
          latest=$(echo "$versions" | tail -1)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Latest release repo: vnmd/qsmxt_${latest}"

          # Only flag a genuine UPGRADE: latest must be strictly greater than
          # the pinned version. A plain `latest != current` string compare would
          # also fire if the pin were somehow ahead of Docker Hub (e.g. a yanked
          # release), filing a bogus "downgrade" issue — which is exactly the
          # class of bug that produced "8.3.2 → 1.1.7". We decide "newer" by
          # asking sort -V whether current is the max of {current, latest}: if it
          # is, nothing newer exists.
          current='${{ steps.current.outputs.version }}'
          highest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)
          if [ "$latest" != "$current" ] && [ "$highest" = "$latest" ]; then
            echo "update_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "update_available=false" >> "$GITHUB_OUTPUT"
            echo "Pinned version $current is up to date (latest release: $latest)."
          fi

      - name: Create issue if update available
        if: steps.check.outputs.update_available == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const current = '${{ steps.current.outputs.version }}';
            const latest = '${{ steps.check.outputs.latest }}';

            // Check for an existing open issue to avoid duplicates
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies',
            });
            const title = `QSMxT base image update available: ${current} → ${latest}`;
            const existing = issues.find(i => i.title === title);
            if (existing) {
              console.log(`Issue already exists: #${existing.number}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `A newer QSMxT base image is available on Docker Hub.\n\n` +
                    `- Current: \`vnmd/qsmxt_${current}\`\n` +
                    `- Available: \`vnmd/qsmxt_${latest}\`\n\n` +
                    `See the [update procedure](QSMxT/README.md#maintaining-the-base-image).`,
              labels: ['dependencies'],
            });
