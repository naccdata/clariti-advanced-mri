name: Build QSM-MEDI gear

# Verifies the qsm-medi gear image builds from a clean checkout.
# Build-only: does not push to any registry or deploy to Flywheel.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'qsm-medi/**'
      - '.github/workflows/build-qsm-medi.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image is large (MCR ~4.6GB download + install, plus Python deps).
      # The default runner has limited free disk, so reclaim space first by
      # removing preinstalled toolchains this build does not need.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Run unit tests and lint
        working-directory: qsm-medi
        run: |
          pipx install uv || pip install uv
          uv run --no-project --with pytest pytest tests/ -o "addopts="
          uv run --no-project --with ruff ruff check src/flywheel/ src/scripts/

      - name: Build image
        working-directory: qsm-medi
        run: |
          docker build --platform linux/amd64 -t qsm-medi:ci . --progress=plain

      - name: Report image size
        run: docker images qsm-medi:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
